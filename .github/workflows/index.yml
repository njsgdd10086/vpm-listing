name: 重建 VPM 索引

# 把各插件仓库的 Release 合并成一份 VPM 索引，推送到本仓库的 gh-pages。
# 索引地址：https://njsgdd10086.github.io/vpm-listing/index.json
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/make_vpm_repo.py'
      - '.github/workflows/index.yml'
  schedule:
    # 每 15 分钟跟一次插件仓库的新版本（发版后最迟一刻钟出现在索引里；
    # 想立刻刷新就在 Actions 页面手动跑一次本工作流）
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 定时任务和手动触发可能撞在一起，串行执行免得两边同时强推 gh-pages
concurrency:
  group: vpm-index
  cancel-in-progress: false

env:
  # 索引里要列出的所有包所在仓库
  PACKAGE_REPOS: 'njsgdd10086/LilToNonToonSwitcher njsgdd10086/NonToonLightLimit'

jobs:
  vpm-repo:
    name: 生成索引并推送到 gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备 gh-pages 工作目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          cd pages
          git init -q
          git checkout -q -b gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: 抓取各插件仓库的 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for repo in $PACKAGE_REPOS; do
            file="releases-$(echo "$repo" | tr '/' '-').json"
            echo "抓取 $repo 的 release"
            gh api "repos/$repo/releases?per_page=100" > "$file"
          done

      - name: 生成索引
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make_vpm_repo.py \
            --releases releases-*.json \
            --repository "${{ github.repository }}" \
            --output-dir pages
          echo "=== index.json ==="
          cat pages/index.json

      - name: 自检索引内容
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("pages/index.json").read_text(encoding="utf-8"))
          packages = data.get("packages") or {}
          assert packages, "索引里一个包都没有"
          # VCC 的仓库模型：仓库级 author 是字符串、版本级 author 是对象，写反了 VCC 会直接拒绝加载（ALCOM 宽松所以看不出来）
          assert isinstance(data.get("author"), str), "仓库级 author 必须是字符串"
          for name, pkg in packages.items():
              versions = pkg.get("versions") or {}
              assert versions, f"{name} 没有任何版本"
              for version, entry in versions.items():
                  assert entry.get("url"), f"{name} {version} 没有下载地址"
                  assert entry.get("name") == name, f"{name} {version} 的 name 字段对不上"
                  assert entry.get("version") == version, f"{name} {version} 的 version 字段对不上"
                  assert entry.get("unity"), f"{name} {version} 没有 unity 版本"
                  assert isinstance(entry.get("author"), dict), f"{name} {version} 的 author 必须是对象"
                  assert isinstance(entry.get("keywords"), list), f"{name} {version} 没有 keywords 列表"
          print("索引自检通过：", {n: list(p["versions"]) for n, p in packages.items()})

          page = pathlib.Path("pages/index.html").read_text(encoding="utf-8")
          assert page.lstrip().startswith("<!DOCTYPE html>"), "index.html 不是完整的网页"
          for name, pkg in packages.items():
              assert name in page, f"index.html 里没有列出 {name}"
              for version in pkg["versions"]:
                  assert version in page, f"index.html 里没有列出 {name} {version}"
          assert "index.json" in page, "index.html 里没有指向 index.json 的说明"
          print("页面自检通过：", len(page), "字节")
          PY

      - name: 推送到 gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore: 更新 VPM 索引" || echo "无变化"
          git push -f origin gh-pages
          echo "gh-pages 已更新"
